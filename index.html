<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Mídias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Hub de Mídias</h1>
        <p>Gerenciador de Jogos, Filmes e Séries</p>
    </header>
    <main class="container">
        <section class="painel_cadastro">
            <h2>Adicionar à Lista de Mídias </h2>
            <form action="" id="form midia">
                <input type="text" id="titulo" placeholder="Ex: Valorant" required>
                <select id="categoria" required>
                    <option value="Categoria">Categoria</option>
                        <option value="Jogos">Jogos</option>
                        <option value="Filmes">Filmes</option>
                        <option value="Séries">Séries</option>
                    </select>
                    <input type="text" id="plataforma" placeholder="Ex: Netflix, PC" required>
                    <input type="number" id="nota" step="0.1" min="0" max="10" placeholder="Ex: 0 a 10.0" required>
                    <button type="submit" class="btn-salvar">Adicionar</button>
            </form>
        </section>
        <section class="painel-catalogo">
            <div class="filtros">
                <button>Todos</button>
                <button>Jogos</button>
                <button>Filmes</button>
                <button>Séries</button>
            </div>
            <div id="catalogo-grid" class="grid">
                <!--Os card serão exibidos aqui-->
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
